<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 431 273" role="img" aria-labelledby="title description">
  <title id="title">Recreated OpenAI quota panel</title>
  <desc id="description">An SVG recreation of the actual OpenCode quota panel, not a captured screenshot. Example values show 19 percent remaining in the 5-hour window and 58 percent remaining weekly. Appearance varies by terminal, font, and theme.</desc>

  <rect width="431" height="273" fill="#1a1a1a"/>

  <g font-family="Cascadia Mono, JetBrains Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="20" font-weight="500">
    <text x="20" y="37" fill="#0087ff">OpenAI quota</text>

    <circle cx="26" cy="53" r="5" fill="#3cab58"/>
    <text x="43" y="60" fill="#3cab58">Quota up to date</text>

    <text x="20" y="83" fill="#858585">5-hour</text>
    <text x="404" y="83" fill="#e8e8e8" text-anchor="end">19% left</text>
    <rect x="20" y="98" width="24" height="4" fill="#e34d61"/>

    <text x="20" y="129" fill="#858585">Weekly</text>
    <text x="404" y="129" fill="#e8e8e8" text-anchor="end">58% left</text>
    <rect x="20" y="144" width="72" height="4" fill="#ffb000"/>

    <text x="20" y="175" fill="#858585">Next reset · 5h · Oct 21, 10:12</text>
    <text x="20" y="198" fill="#858585">PM · 33m</text>

    <text x="20" y="221" fill="#858585">Updated 9:38:58 PM</text>
    <text x="20" y="244" fill="#858585">Manual refresh: command palette</text>
  </g>
</svg>
