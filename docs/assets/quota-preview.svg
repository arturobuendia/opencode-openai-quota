<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 376" role="img" aria-labelledby="title description">
  <title id="title">Recreated OpenAI quota sidebar panel</title>
  <desc id="description">An SVG recreation of the OpenCode 2 quota panel, not a captured screenshot. Example values show 68 percent remaining in the 5-hour session window, 9 percent remaining weekly in red, two available banked resets, and their next reported expiration. Colors follow the active OpenCode theme; balances at or below 25 percent turn amber and at or below 10 percent turn red.</desc>

  <rect width="440" height="376" rx="8" fill="#1a1a1a" stroke="#2b2f36"/>

  <g font-family="Cascadia Mono, JetBrains Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="17">
    <text x="24" y="42" fill="#e8e8e8" font-weight="700">OpenAI Quota</text>
    <text x="24" y="66" fill="#858585">Updated just now</text>

    <text x="24" y="100" fill="#e8e8e8" font-weight="700">Session (5h)</text>
    <text x="24" y="124"><tspan fill="#e8e8e8">━━━━━━━━━━━━━━━━</tspan><tspan fill="#858585">───────</tspan></text>
    <text x="24" y="148" fill="#e8e8e8">68% remaining</text>
    <text x="24" y="172" fill="#858585">Resets in 4h 12m</text>

    <text x="24" y="206" fill="#e8e8e8" font-weight="700">Weekly</text>
    <text x="24" y="230"><tspan fill="#f87171">━━━</tspan><tspan fill="#858585">────────────────────</tspan></text>
    <text x="24" y="254" fill="#f87171">9% remaining</text>
    <text x="24" y="278" fill="#858585">Resets in 2d 7h</text>

    <text x="24" y="312" fill="#858585">───────────────────────</text>
    <text x="24" y="336" fill="#e8e8e8">2 available banked resets</text>
    <text x="24" y="360" fill="#858585">Next expires in 9d</text>
  </g>
</svg>
